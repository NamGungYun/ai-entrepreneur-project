<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>혼밥 탈출 스토리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hoony-majormap/majormap-fonts@1.0.0/css/paperlogy.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hoony-majormap/majormap-fonts@1.0.0/css/ibm-plex-sans-kr.css">
<link rel="stylesheet" href="카드뉴스/card.css">
<style>
  .card { padding: 180px 96px 220px; }
  .title { font-size: 120px; margin-top: 72px; }
  .body { font-size: 44px; margin-top: 36px; max-width: none; }
  .row { flex: 1; display: flex; align-items: flex-end; gap: 56px; min-height: 0; margin-top: 64px; }
  .phone { width: 390px; }
  .side { flex: 1; padding-bottom: 8px; }
  .qr { width: 320px; height: 320px; }
  .url { font-size: 30px; margin-top: 32px; }
</style>
</head>
<body class="story">
<div class="card">
  <div class="top"><div class="wordmark">혼밥 <b>탈출</b></div><div class="label">수업용 시제품</div></div>
  <h1 class="title">오늘 같이 먹을 사람 <b>있어요?</b></h1>
  <p class="body">밥약 방을 열고, 버튼 한 번으로 참여해요.</p>
  <div class="row">
    <div class="phone"><img src="../screenshot.png" alt="혼밥 탈출 방 목록 화면 (예시 데이터)"></div>
    <div class="side">
      <div class="qr"><img src="../qr.png" alt="혼밥 탈출 서비스 QR"></div>
      <div class="url"><span>QR을 찍거나 주소로 들어와요</span>https://namgungyun.github.io/<br><em>ai-entrepreneur-project</em>/</div>
    </div>
  </div>
</div>
</body>
</html>
